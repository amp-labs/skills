name: evals

on:
  workflow_dispatch:
    inputs:
      arms:
        description: Arms to run, separated by spaces, or "all"
        default: all
      effort:
        description: Reasoning effort for every arm
        type: choice
        options: [medium, low, high]
        default: medium
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evals:
    name: run evals
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-evals' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: evals
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/run-evals.yml
    secrets: inherit
    with:
      arms: ${{ inputs.arms || 'all' }}
      effort: ${{ inputs.effort || 'medium' }}
      report: evals
