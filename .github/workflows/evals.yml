name: evals

on:
  workflow_dispatch:
    inputs:
      arms:
        description: Arms to run, separated by spaces, or "all"
        default: all

permissions:
  contents: read

concurrency:
  group: evals

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: evals
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          working-directory: evals

      - name: Run arms one at a time
        env:
          ARMS: ${{ inputs.arms }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
          AMP_EVAL_PROJECT: ${{ vars.AMP_EVAL_PROJECT }}
        run: |
          if [ "$ARMS" = all ]; then ARMS=$(for f in experiments/*.ts; do basename "$f" .ts; done | tr '\n' ' '); fi
          echo "ARMS_RUN=$ARMS" >> "$GITHUB_ENV"
          read -ra arms <<< "$ARMS"
          if [ ${#arms[@]} -eq 0 ]; then echo "::error::Name at least one arm, or all"; exit 1; fi
          for arm in "${arms[@]}"; do npm run eval -- "$arm" || true; done

      - name: Summarize
        if: always()
        run: |
          read -ra arms <<< "$ARMS_RUN"
          node scripts/summarize-results.ts results "${arms[@]}" >> "$GITHUB_STEP_SUMMARY"
